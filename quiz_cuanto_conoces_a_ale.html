<index.html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cuánto conoces a Ale?</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f8f5fa,#17131c);--panel:light-dark(#fff,#241d2b);--text:light-dark(#211a27,#f8f1fb);--muted:light-dark(#716678,#c0b4c9);--accent:light-dark(#a52f50,#ef7595);--line:light-dark(#e6dce9,#49384f)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 48px}.hero{padding:26px 22px;border-radius:24px;background:linear-gradient(135deg,#201522,#54243c 55%,#24304e);color:#fff;box-shadow:0 12px 32px #0002}
.kicker{letter-spacing:.12em;text-transform:uppercase;font-size:.76rem;color:#f3b5c6;font-weight:700}.hero h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;margin:.5rem 0}.hero p{color:#f1e5ef}.pill{display:inline-block;border:1px solid #ffffff55;border-radius:99px;padding:5px 10px;margin:4px 4px 0 0;font-size:.8rem}
.namebox,.question,.result{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}.label{display:block;font-weight:700;margin-bottom:8px}input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.progressrow{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:22px 2px 8px}.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.question h2{font-size:1.08rem;margin:0 0 14px}.option{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;margin:8px 0;border:1px solid var(--line);border-radius:12px;cursor:pointer}.option:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}.option input{margin-top:5px;accent-color:var(--accent)}
button{font:inherit;font-weight:750;border:0;border-radius:13px;padding:13px 16px;cursor:pointer}.primary{background:var(--accent);color:white;width:100%;margin-top:20px}.secondary{background:transparent;border:1px solid var(--line);color:var(--text);width:100%;margin-top:10px}.muted{color:var(--muted);font-size:.9rem}.result{text-align:center;padding:24px}.score{font-size:3rem;font-weight:850;line-height:1.2;color:var(--accent)}.review{text-align:left;margin-top:20px}.review-item{padding:12px 0;border-bottom:1px solid var(--line)}.good{color:#35a66a}.bad{color:#e36d7d}.hidden{display:none}.sharetext{background:var(--bg);padding:12px;border-radius:12px;white-space:pre-wrap;text-align:left}
</style></head>
<body><main>
<header class="hero"><div class="kicker">Edición especial · Halloween vibes 🎃</div><h1>¿Cuánto conoces a Ale?</h1><p>20 preguntas sobre sus gustos, fandoms y personalidad. Demuestra que conoces el lore de Ale. 🐈‍⬛</p><span class="pill">🖤 Dark vibes</span><span class="pill">🐍 Fandoms</span><span class="pill">🏆 Puntuación automática</span></header>
<section class="namebox"><label class="label" for="player">Nombre o apodo del participante</label><input id="player" type="text" placeholder="¿Quién está jugando?"></section>
<div class="progressrow"><span>Ronda de preguntas</span><span id="count">0 de 20 respondidas</span></div><div class="bar"><div class="fill" id="fill"></div></div>
<form id="quiz"></form>
<section id="result" class="result hidden" aria-live="polite"></section>
</main>
<script>
const questions = [["¿Cuál es la combinación de colores favorita de Ale?", ["Rosa, blanco y lila", "Negro, rojo, rojo oscuro y azul", "Verde, amarillo y naranja", "Celeste y blanco"], 1, "Su paleta favorita mezcla tonos oscuros, rojo y azul."], ["¿Cuáles son sus comidas favoritas?", ["Sushi y ramen", "Hamburguesas y tacos", "Pizza y chaufa", "Pasta y ensalada"], 2, "¡Pizza y chaufa!"], ["¿Qué bebida prefiere?", ["Limonada", "Café", "Té de durazno", "Chocolate caliente"], 0, "Su bebida favorita es la limonada."], ["¿Cuál es su snack dulce favorito?", ["Brownies", "Helado de fresa", "Galletas de chocolate", "Cheesecake"], 1, "¡Helado de fresa!"], ["¿Qué clima le gusta más?", ["Mucho calor y sol", "Lluvia torrencial", "Nublado, pero sin lluvia", "Frío extremo con nieve"], 2, "Prefiere los días nublados sin lluvia."], ["¿Cuál es su animal favorito?", ["Lobos", "Gatos", "Conejos", "Cuervos"], 1, "¡Los gatos!"], ["¿Qué canción le gusta actualmente?", ["Change — Deftones", "Rosemary — Deftones", "Smells Like Teen Spirit — Nirvana", "After Dark — Mr.Kitty"], 1, "Su canción favorita del momento es Rosemary, de Deftones."], ["¿Cuál es su anime favorito?", ["Naruto", "Jujutsu Kaisen", "Bleach", "Death Note"], 2, "¡Bleach!"], ["¿Quién es su personaje favorito de Bleach?", ["Ichigo Kurosaki", "Byakuya Kuchiki", "Grimmjow Jaegerjaquez", "Kisuke Urahara"], 2, "Su favorito es Grimmjow Jaegerjaquez."], ["¿Qué personaje de Harry Potter es uno de sus favoritos?", ["Neville Longbottom", "Draco Malfoy", "Cedric Diggory", "Sirius Black"], 1, "¡Draco Malfoy!"], ["¿Qué personaje de videojuegos le encanta?", ["Kratos", "Leon Kennedy", "Dante Sparda", "Sonic"], 2, "Su favorito de videojuegos es Dante Sparda."], ["¿Cuál es su serie favorita?", ["Supernatural", "Smallville", "The Vampire Diaries", "Stranger Things"], 1, "¡Smallville!"], ["¿Cuál es uno de sus pasatiempos?", ["Cocinar y hacer senderismo", "Jugar Roblox y Brawl Stars, escuchar música y dibujar", "Practicar tenis y nadar", "Solo leer novelas"], 1, "Disfruta los videojuegos, la música y el dibujo."], ["¿Qué rasgos describen mejor a Ale?", ["Extrovertida, organizada y siempre habladora", "Tímida, despistada, antisocial, risueña y seria", "Muy competitiva y siempre impaciente", "Súper habladora y nunca distraída"], 1, "Ale se describe como tímida, despistada, antisocial, risueña y seria."], ["¿Cuál es su mayor miedo?", ["La oscuridad", "Las alturas", "Los insectos", "El océano"], 1, "Le dan miedo las alturas."], ["¿Cuál es su mes favorito?", ["Diciembre", "Febrero", "Octubre", "Julio"], 2, "¡Octubre! 🎃"], ["¿Qué apodo le ponen sus amigos?", ["Dani", "Ale", "Luna", "Alex"], 1, "La llaman Ale."], ["¿Qué combinación describe a varios de sus crushes ficticios?", ["Solo personajes de Disney", "Solo magos de Hogwarts", "Draco, Bakugo, Leon Kennedy, Clark Kent y Shadow", "Todos son personajes de Bleach"], 2, "Su lista mezcla anime, videojuegos, superhéroes y Harry Potter."], ["Si Ale siente que la excluyen demasiado, ¿qué suele hacer?", ["Intenta llamar la atención de todos", "Se aleja", "Siempre se queda aunque se sienta incómoda", "Se muda a Hogwarts"], 1, "Cuando siente que la excluyen demasiado, suele alejarse."], ["¿Qué plan podría gustarle especialmente?", ["Un día de música, dibujo y videojuegos con clima nublado", "Escalar una montaña bajo el sol", "Una fiesta enorme todos los días", "Un paseo bajo lluvia intensa"], 0, "Un plan tranquilo, creativo y con sus gustos favoritos."]];
const form=document.querySelector('#quiz'), count=document.querySelector('#count'), fill=document.querySelector('#fill');
questions.forEach((q,i)=>{const section=document.createElement('section');section.className='question';section.innerHTML=`<h2>${i+1}. ${q[0]}</h2>`;q[1].forEach((opt,j)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="q${i}" value="${j}"><span>${opt}</span>`;section.append(label)});form.append(section)});
const update=()=>{const n=questions.filter((_,i)=>form.querySelector(`input[name=q${i}]:checked`)).length;count.textContent=`${n} de ${questions.length} respondidas`;fill.style.width=`${n/questions.length*100}%`};
form.addEventListener('change',update);
const btn=document.createElement('button');btn.className='primary';btn.type='submit';btn.textContent='🔓 Revelar mi resultado';form.append(btn);
form.addEventListener('submit',e=>{e.preventDefault();const vals=questions.map((_,i)=>form.querySelector(`input[name=q${i}]:checked`));if(vals.some(v=>!v)){const idx=vals.findIndex(v=>!v);form.querySelectorAll('.question')[idx].scrollIntoView({behavior:'smooth',block:'center'});alert('¡Te faltan preguntas! Responde las 20 para ver tu resultado.');return}
const score=questions.reduce((s,q,i)=>s+(Number(vals[i].value)===q[2]?1:0),0);
const rank=score===20?'Guardián del archivo secreto de Ale 🏆':score>=17?'Mejor amigo/a de élite 🐈‍⬛':score>=13?'Cómplice oficial de Slytherin 🐍':score>=9?'Amistad con potencial 👀':score>=5?'Conocido/a en fase de investigación 🕵️':'¿Y tú cómo llegaste a este quiz? 😭';
const msg=score===20?'¡INCREÍBLE! Conoces hasta el último detalle de Ale.':score>=17?'Estás en el círculo de confianza. ¡Casi tienes el expediente completo!':score>=13?'Conoces muy bien sus gustos, pero quedan secretos por descubrir.':score>=9?'Tienes una buena base. Toca más sesiones de música y fandom.':score>=5?'Hay potencial, pero necesitas una actualización del lore de Ale.':'La amistad necesita una maratón de Bleach y una charla urgente. JAJAJA.';
const result=document.querySelector('#result');result.classList.remove('hidden');result.innerHTML=`<p class="muted">Resultado de ${escapeHtml(document.querySelector('#player').value.trim()||'Participante anónimo')}</p><div class="score">${score}/20</div><h2>${rank}</h2><p><b>${Math.round(score/20*100)}% de aciertos</b></p><p>${msg}</p><button type="button" class="secondary" id="toggle">Ver respuestas correctas</button><div class="review hidden" id="review"></div><button type="button" class="primary" id="copy">📋 Copiar resultado para compartir</button><button type="button" class="secondary" id="again">↻ Jugar otra vez</button>`;
const review=document.querySelector('#review');questions.forEach((q,i)=>{const correct=Number(vals[i].value)===q[2];const item=document.createElement('div');item.className='review-item';item.innerHTML=`<b class="${correct?'good':'bad'}">${correct?'✓':'✗'} ${i+1}. ${q[0]}</b><div>Respuesta: ${q[1][Number(vals[i].value)]}</div><div>Correcta: <b>${q[1][q[2]]}</b></div><div class="muted">${q[3]}</div>`;review.append(item)});
document.querySelector('#toggle').onclick=()=>{review.classList.toggle('hidden');document.querySelector('#toggle').textContent=review.classList.contains('hidden')?'Ver respuestas correctas':'Ocultar respuestas'};
document.querySelector('#copy').onclick=async()=>{const text=`🖤 ¿CUÁNTO CONOCES A ALE? 🐈‍⬛\\nParticipante: ${document.querySelector('#player').value.trim()||'Anónimo'}\\nPuntuación: ${score}/20 (${Math.round(score/20*100)}%)\\nTítulo: ${rank}\\n¡Reta a tus amigos! 🎃`;try{await navigator.clipboard.writeText(text);alert('¡Resultado copiado! Ya puedes pegarlo en tu chat.')}catch{prompt('Copia tu resultado:',text)}};
document.querySelector('#again').onclick=()=>{form.reset();result.classList.add('hidden');update();window.scrollTo({top:0,behavior:'smooth'})};result.scrollIntoView({behavior:'smooth',block:'start'});
});
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
